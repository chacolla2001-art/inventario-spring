spring.application.name=inventario
# Base H2 en memoria para probar sin instalar nada. Para PostgreSQL, definir SPRING_DATASOURCE_URL, _USERNAME y _PASSWORD.
spring.datasource.url=jdbc:h2:mem:inventario;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=always
inventario.demo=true
